<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>iKeyVN Sticker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#F2F2F7}
@media (prefers-color-scheme:dark){html,body{background:#000}}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:15px -apple-system,Roboto,sans-serif;color:#6E6E73}
#load img{width:84px;height:84px;border-radius:20px}
</style></head><body>
<div id="load"><img src="icon-192.png" alt=""><span>Đang mở iKeyVN Sticker…</span></div>
<script>
// Ứng dụng cài trên điện thoại: chỉ là "vỏ" mở trang web thật trên Google Apps Script,
// nên mỗi lần sửa trang web thì app tự có bản mới, không phải cài lại.
const APP = 'https://script.google.com/macros/s/AKfycbzrwq2csr5cogpIZRoOxmkCb9UwvexJaVeUGMvGauOpePZsXleMRp-y_gHuPgQqvhZPhQ/exec';
const q = new URLSearchParams(location.search);
// chia sẻ link sticker từ Telegram vào app -> điền sẵn
const shared = [q.get('url'), q.get('text'), q.get('title')].filter(Boolean).join(' ');
const m = shared.match(/addstickers\/([A-Za-z0-9_]{1,64})/);
const f = document.createElement('iframe');
f.src = APP + '?ui=1' + (m ? '&link=' + encodeURIComponent('https://t.me/addstickers/' + m[1]) : '');
f.allow = 'clipboard-read; clipboard-write';
f.onload = () => { const l = document.getElementById('load'); if (l) l.remove(); };
document.body.appendChild(f);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body></html>
